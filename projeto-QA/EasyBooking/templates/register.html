<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyBooking — Criar conta</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-layout">

    <div class="auth-panel">
      <div class="auth-brand">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>EasyBooking</span>
      </div>
      <p class="auth-tagline">Crie sua conta e comece<br>a agendar em segundos.</p>
      <div class="auth-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="auth-form-area">
      <div class="auth-card">
        <h2>Criar conta</h2>
        <p class="auth-sub">Preencha os dados abaixo para se registrar</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST" class="form">
          <div class="field">
            <label for="nome">Usuário</label>
            <input type="text" id="nome" name="nome" required autofocus
                   placeholder="Escolha um nome de usuário" minlength="3">
          </div>
          <div class="field">
            <label for="nome_completo">Nome completo</label>
            <input type="text" id="nome_completo" name="nome_completo" required
                   placeholder="Digite seu nome completo" minlength="5">
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required
                   placeholder="seu@email.com">
          </div>
          <div class="field">
            <label for="senha">
              Senha
              <span class="field-hint">mínimo 8 caracteres com letras, número e símbolo</span>
            </label>
            <input type="password" id="senha" name="senha" required
                   placeholder="••••••••" minlength="8">
          </div>
          <div class="field">
            <label for="confirm">Confirmar senha</label>
            <input type="password" id="confirm" name="confirm" required
                   placeholder="••••••••" minlength="8">
          </div>
          <button type="submit" class="btn-primary btn-full">Criar conta</button>
        </form>

        <p class="auth-link">Já tem conta? <a href="{{ url_for('login') }}">Fazer login</a></p>
      </div>
    </div>

  </div>
</body>
</html>
