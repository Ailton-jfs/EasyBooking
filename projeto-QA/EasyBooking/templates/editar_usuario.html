{% extends "base.html" %}
{% block title %}Editar Usuário{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Editar Usuário</h1>
    <p class="page-sub">Modifique os dados do usuário</p>
  </div>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="card-header">
    <h3>{{ user.nome }}</h3>
  </div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('admin_editar_usuario', nome=user.nome) }}">
      <div class="form-group">
        <label for="nome_completo">Nome Completo</label>
        <input type="text" id="nome_completo" name="nome_completo" value="{{ user.nome_completo or '' }}" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ user.email or '' }}" required>
      </div>

      <div class="form-group">
        <label for="role">Perfil</label>
        <select id="role" name="role" required>
          <option value="user" {% if user.role == 'user' %}selected{% endif %}>Usuário</option>
          <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrador</option>
        </select>
      </div>

      <div class="form-group">
        <label for="senha">Nova Senha (deixe em branco para não alterar)</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••">
        <small>Deixe em branco para manter a senha atual</small>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        <a href="{{ url_for('admin') }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<style>
  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #333;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
  }

  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
  }

  .form-group small {
    display: block;
    margin-top: 4px;
    color: #666;
    font-size: 12px;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 30px;
  }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    display: inline-block;
    transition: all 0.2s;
  }

  .btn-primary {
    background: #60a5fa;
    color: white;
  }

  .btn-primary:hover {
    background: #3b82f6;
  }

  .btn-secondary {
    background: #e5e7eb;
    color: #333;
  }

  .btn-secondary:hover {
    background: #d1d5db;
  }
</style>
{% endblock %}
